<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZoomBoom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffb020'/%3E%3Cstop offset='.5' stop-color='%23ff3d7f'/%3E%3Cstop offset='1' stop-color='%237b5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M18 16h30L30 36h14L20 52l8-14H16z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0910; --panel: #13111c; --line: #2a2538; --text: #f1eefb; --muted: #9690ab;
    --hover: #1d1a2a; --a1: #ffb020; --a2: #ff3d7f; --a3: #7b5cff;
    --grad: linear-gradient(100deg, var(--a1), var(--a2) 50%, var(--a3));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 Inter, "Segoe UI", system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 1fr 380px; grid-template-rows: auto 1fr; height: 100vh;
    background: radial-gradient(1200px 500px at 15% -10%, #2a1230 0%, transparent 60%), var(--bg); }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); }
  .logo { display: flex; align-items: center; height: 46px; }
  .logo svg { height: 100%; width: auto; overflow: visible; }
  .eq rect { transform-box: fill-box; transform-origin: bottom; animation: eq 1s ease-in-out infinite alternate; animation-play-state: paused; }
  body.playing .eq rect { animation-play-state: running; }
  .eq rect:nth-child(2) { animation-duration: .7s; } .eq rect:nth-child(3) { animation-duration: 1.2s; } .eq rect:nth-child(4) { animation-duration: .85s; }
  @keyframes eq { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
  body.playing .streak { animation: streak 1.6s linear infinite; }
  .streak:nth-of-type(2) { animation-delay: -.5s; } .streak:nth-of-type(3) { animation-delay: -1.1s; }
  @keyframes streak { 0% { transform: translateX(20px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateX(-30px); opacity: 0; } }
  .count { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  main { display: flex; flex-direction: column; padding: 20px; gap: 16px; min-width: 0; }
  .frame { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden;
    max-height: calc(100vh - 230px); box-shadow: 0 0 0 1px var(--line), 0 20px 60px -20px #ff3d7f55; }
  .frame > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  .now { min-height: 44px; }
  .now .t { font-size: 18px; font-weight: 600; }
  .now .c { font-size: 13px; margin-top: 2px; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content; font-weight: 600; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--a2); background: var(--hover); }
  button.on { border-color: var(--a2); color: #ff8fb4; }
  button.primary { background: var(--grad); border: 0; color: #fff; font-weight: 600; }
  input[type=range] { accent-color: var(--a2); width: 120px; }
  aside { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: #0f0d17cc; }
  .search { padding: 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
  .search input, .search select { background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font: inherit; }
  .search input { flex: 1; min-width: 0; }
  ol { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  li { padding: 8px 12px; border-bottom: 1px solid #1a1724; cursor: pointer; display: flex; gap: 10px; }
  li:hover { background: var(--hover); }
  li.cur { background: #24142a; box-shadow: inset 3px 0 var(--a2); }
  li .n { color: var(--muted); width: 36px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  li .m { min-width: 0; }
  li .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .cc { color: var(--muted); font-size: 12px; }
  .hint { color: var(--muted); font-size: 12px; }
  .warn { display: none; padding: 12px 14px; border: 1px solid #ff3d7f66; background: #ff3d7f14; border-radius: 8px; font-size: 13px; }
  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); height: 60vh; }
    main { padding: 16px; }
    .count { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="logo" aria-label="ZoomBoom">
    <svg viewBox="0 0 368 64" role="img">
      <defs>
        <linearGradient id="zg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ffb020"/><stop offset=".5" stop-color="#ff3d7f"/><stop offset="1" stop-color="#7b5cff"/>
        </linearGradient>
        <linearGradient id="zb" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffb020"/><stop offset=".5" stop-color="#ff3d7f"/><stop offset="1" stop-color="#7b5cff"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
          <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- badge: lightning bolt -->
      <rect x="0" y="4" width="56" height="56" rx="15" fill="url(#zb)" filter="url(#glow)" opacity=".35"/>
      <rect x="0" y="4" width="56" height="56" rx="15" fill="url(#zb)"/>
      <path d="M15 15h27L26 33h12L17 51l7-13H13z" fill="#fff"/>
      <!-- speed streaks -->
      <g stroke-width="3" stroke-linecap="round">
        <line class="streak" x1="70" y1="22" x2="86" y2="22" stroke="#ffb020"/>
        <line class="streak" x1="66" y1="33" x2="86" y2="33" stroke="#ff3d7f"/>
        <line class="streak" x1="72" y1="44" x2="86" y2="44" stroke="#7b5cff"/>
      </g>
      <!-- wordmark -->
      <g transform="skewX(-10)">
        <text x="98" y="46" font-family="Bungee, Impact, 'Arial Black', sans-serif" font-size="36" fill="url(#zg)" textLength="226" lengthAdjust="spacingAndGlyphs">ZOOMBOOM</text>
      </g>
      <!-- eq bars -->
      <g class="eq" fill="url(#zg)">
        <rect x="334" y="20" width="5" height="28" rx="2"/>
        <rect x="342" y="14" width="5" height="34" rx="2"/>
        <rect x="350" y="24" width="5" height="24" rx="2"/>
        <rect x="358" y="18" width="5" height="30" rx="2"/>
      </g>
    </svg>
  </div>
  <span class="count" id="count"></span>
  <span class="spacer"></span>
</header>
<main>
  <div class="warn" id="warn"></div>
  <div class="frame"><div id="player"></div></div>
  <div class="now"><div class="t" id="nowTitle">—</div><div class="c" id="nowChan"></div></div>
  <div class="controls">
    <button id="prev">⏮ Prev</button>
    <button id="play" class="primary">⏯ Play / Pause</button>
    <button id="next">Next ⏭</button>
    <button id="shuffle">🔀 Shuffle</button>
    <button id="loop">🔁 Loop all</button>
    <span class="hint">Vol</span><input type="range" id="vol" min="0" max="100" value="60">
  </div>
  <div class="hint">No ads with YouTube Premium: just be signed in to YouTube in this browser. Keys: Space play/pause · N next · P prev.</div>
</main>
<aside>
  <div class="search">
    <input id="q" placeholder="Search tracks…">
    <select id="chan"><option value="">All channels</option></select>
  </div>
  <ol id="list"></ol>
</aside>

<script>
// Track list snapshot: [channels, updatedUnix, [[videoId, title, channelIndex, seconds], ...]]
const DATA = /*__DATA__*/null;

const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem('zoomboom:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('zoomboom:' + k, JSON.stringify(v)); } catch {} }
};

const [CHANNELS, UPDATED, ROWS] = DATA;
const all = ROWS.map(([id, title, c, duration]) => ({ id, title, channel: CHANNELS[c], duration }));
let order = [], pos = 0, player, ready = false, errStreak = 0;
let shuffle = store.get('shuffle', true), loop = store.get('loop', true);

function shuffled(n) {
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function buildOrder(keepId) {
  order = shuffle ? shuffled(all.length) : [...all.keys()];
  const i = keepId ? all.findIndex(v => v.id === keepId) : -1;
  if (i >= 0) { order.splice(order.indexOf(i), 1); order.unshift(i); }
  pos = 0;
}
const cur = () => all[order[pos]];

function playAt(p) {
  if (p >= order.length) { if (!loop) return; if (shuffle) buildOrder(); p = 0; }
  if (p < 0) p = order.length - 1;
  pos = p;
  const v = cur();
  store.set('last', v.id);
  $('#nowTitle').textContent = v.title;
  $('#nowChan').textContent = v.channel;
  document.title = v.title + ' · ZoomBoom';
  if (ready) player.loadVideoById(v.id);
  renderList();
}

function fmt(s) { if (!s) return ''; s = Math.round(s); const h = s / 3600 | 0, m = (s % 3600) / 60 | 0, x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }

function renderList() {
  const q = $('#q').value.toLowerCase(), ch = $('#chan').value, curId = cur()?.id;
  const ol = $('#list'); ol.textContent = '';
  const frag = document.createDocumentFragment();
  order.forEach((idx, p) => {
    const v = all[idx];
    if (ch && v.channel !== ch) return;
    if (q && !v.title.toLowerCase().includes(q)) return;
    const li = document.createElement('li');
    if (v.id === curId) li.className = 'cur';
    li.innerHTML = '<span class="n"></span><div class="m"><div class="tt"></div><div class="cc"></div></div>';
    li.querySelector('.n').textContent = p + 1;
    li.querySelector('.tt').textContent = v.title;
    li.querySelector('.cc').textContent = v.channel + (v.duration ? ' · ' + fmt(v.duration) : '');
    li.onclick = () => playAt(p);
    frag.appendChild(li);
  });
  ol.appendChild(frag);
  ol.querySelector('.cur')?.scrollIntoView({ block: 'nearest' });
}

function syncButtons() { $('#shuffle').classList.toggle('on', shuffle); $('#loop').classList.toggle('on', loop); }
function warn(html) { const w = $('#warn'); w.innerHTML = html; w.style.display = 'block'; }

// Channel filter + header count
CHANNELS.forEach(c => { const o = document.createElement('option'); o.value = o.textContent = c; $('#chan').appendChild(o); });
$('#count').textContent = `${all.length} tracks · ${CHANNELS.length} channels · list from ${new Date(UPDATED * 1000).toLocaleDateString()}`;

// YouTube IFrame API
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
tag.onerror = () => warn('Couldn\'t reach YouTube. Check your internet connection.');
document.head.appendChild(tag);
window.onYouTubeIframeAPIReady = () => {
  const vars = { autoplay: 1, playsinline: 1, rel: 0 };
  if (location.protocol.startsWith('http')) vars.origin = location.origin;
  player = new YT.Player('player', {
    playerVars: vars,
    events: {
      onReady: () => { ready = true; player.setVolume(+$('#vol').value); player.loadVideoById(cur().id); },
      onStateChange: e => {
        document.body.classList.toggle('playing', e.data === YT.PlayerState.PLAYING);
        if (e.data === YT.PlayerState.ENDED) playAt(pos + 1);
        if (e.data === YT.PlayerState.PLAYING) errStreak = 0;
      },
      // Removed or embed-blocked video: skip it
      onError: e => {
        if (e.data === 153) return warn('YouTube won\'t play videos on a page opened straight from a file. ' +
          'Open ZoomBoom from its web link instead (for example a GitHub Pages or Netlify address).');
        if (++errStreak < 8) return setTimeout(() => playAt(pos + 1), 400);
        warn(`YouTube refused to play several videos in a row (error ${e.data}).` +
          (location.protocol === 'file:' ? ' YouTube may block players opened straight from a file. Try another browser, or open this page from a web link instead.' : ''));
      }
    }
  });
};

$('#vol').value = store.get('vol', 60);
$('#vol').oninput = e => { store.set('vol', +e.target.value); ready && player.setVolume(+e.target.value); };
$('#next').onclick = () => playAt(pos + 1);
$('#prev').onclick = () => playAt(pos - 1);
$('#play').onclick = () => { if (!ready) return; player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo(); };
$('#shuffle').onclick = () => { shuffle = !shuffle; store.set('shuffle', shuffle); buildOrder(cur()?.id); syncButtons(); renderList(); };
$('#loop').onclick = () => { loop = !loop; store.set('loop', loop); syncButtons(); };
$('#q').oninput = renderList;
$('#chan').onchange = renderList;
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select')) return;
  if (e.code === 'Space') { e.preventDefault(); $('#play').click(); }
  if (e.key === 'n') $('#next').click();
  if (e.key === 'p') $('#prev').click();
});

syncButtons();
buildOrder(store.get('last'));
playAt(0);
</script>
</body>
</html>
